<!DOCTYPE html>
<html lang="en-us">
<head>
    <title>Doom</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: monospace;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            will-change: contents;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
        }

        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0f0;
            font-size: 20px;
            text-align: center;
            z-index: 100;
            text-shadow: 0 0 10px #0f0;
        }

        /* DIAGNOSTIC overlay: shows the last log lines on screen so the
           hang location is visible on the TV without remote debugging. */
        #log {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            max-height: 40%;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.75);
            color: #0f0;
            font-size: 13px;
            line-height: 1.35;
            padding: 6px 10px;
            z-index: 200;
            white-space: pre-wrap;
            word-break: break-all;
            pointer-events: none;
        }
        #log .err { color: #f66; }
        #log .warn { color: #ff0; }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="1"></canvas>
    <div id="status">Loading Doom...</div>
    <div id="log"></div>

    <script src="input.js"></script>

    <script>
        'use strict';

        const statusElement = document.getElementById('status');
        const canvasElement = document.getElementById('canvas');
        const logElement = document.getElementById('log');

        // ---- DIAGNOSTIC helpers -------------------------------------------
        // On-screen log panel: keeps the last MAX_LOG_LINES lines visible so
        // the exact hang location is readable on the TV screen.
        const MAX_LOG_LINES = 18;
        const logLines = [];
        function logLine(text, cls) {
            const ts = new Date().toISOString().substr(11, 12);
            const line = '[' + ts + '] ' + text;
            logLines.push(line);
            if (logLines.length > MAX_LOG_LINES) {
                logLines.shift();
            }
            logElement.innerHTML = logLines.map(function (l) {
                return '<span class="' + (cls || '') + '">' +
                    l.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</span>\n';
            }).join('');
            console.log(line);
        }
        function logErr(text) { logLine(text, 'err'); }
        function logWarn(text) { logLine(text, 'warn'); }

        logLine('index.html loaded, starting game bootstrap...');

        // Watchdog: if the runtime is not initialized within this many ms,
        // show a prominent error instead of hanging on "Starting game...".
        const WATCHDOG_MS = 20000;
        let watchdogFired = false;
        const watchdog = setTimeout(function () {
            watchdogFired = true;
            logErr('WATCHDOG: onRuntimeInitialized not reached after ' +
                   (WATCHDOG_MS / 1000) + 's. The game is stuck in main() ' +
                   '(likely audio init). Last log lines above.');
            statusElement.textContent = 'STUCK - see log below';
            statusElement.style.color = '#f66';
        }, WATCHDOG_MS);

        // Internal render resolution. The software renderer is the bottleneck,
        // so we render at a low resolution and let CSS upscale to full screen.
        // Lower to 640x400 on very weak TVs if 960x540 is still too slow.
        const GAME_WIDTH = 960;
        const GAME_HEIGHT = 540;

        var Module = {
            arguments: [
                "-iwad", "doom1.wad",
                "-window",
                "-nogui",
                "-config", "default.cfg",
                "-extraconfig", "chocolate-doom.cfg",
                "-width", GAME_WIDTH.toString(),
                "-height", GAME_HEIGHT.toString()
            ],

            preRun: [
                function () {
                    logLine('preRun: Loading game files...');
                    try {
                        Module.FS_createPreloadedFile('/', 'doom1.wad', 'doom1.wad', true, false);
                        Module.FS_createPreloadedFile('/', 'default.cfg', 'default.cfg', true, false);
                        Module.FS_createPreloadedFile('/', 'chocolate-doom.cfg', 'chocolate-doom.cfg', true, false);
                        logLine('Files loaded successfully');
                    } catch (e) {
                        logErr('Error loading files: ' + e);
                        Module.setStatus('Error loading game files');
                    }
                }
            ],

            postRun: [],

            print: function (text) {
                logLine(text);
            },

            printErr: function (text) {
                logErr(text);
            },

            canvas: (function () {
                canvasElement.addEventListener("webglcontextlost", function (e) {
                    alert('WebGL context lost. You will need to reload the page.');
                    e.preventDefault();
                }, false);

                canvasElement.addEventListener("webglcontextrestored", function (e) {
                    console.log('WebGL context restored');
                }, false);

                return canvasElement;
            })(),

            setStatus: function (text) {
                if (text) {
                    logLine('Status: ' + text);
                    statusElement.textContent = text;
                    statusElement.style.display = 'block';
                } else {
                    statusElement.style.display = 'none';
                }
            },

            totalDependencies: 0,

            monitorRunDependencies: function (left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(
                    left
                        ? 'Loading... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
                        : 'Starting game...'
                );
            },

            onRuntimeInitialized: function () {
                clearTimeout(watchdog);
                logLine('Runtime initialized successfully');
                Module.setStatus('');
                canvasElement.focus();
                setupRemoteControl();
            },

            onAbort: function (what) {
                clearTimeout(watchdog);
                logErr('Abort: ' + what);
                Module.setStatus('Game crashed: ' + what);
            },

            onExit: function (code) {
                clearTimeout(watchdog);
                logLine('Game exited with code: ' + code);
                Module.setStatus('Game exited');
                try {
                    if (window.tizen && tizen.application) {
                        tizen.application.getCurrentApplication().exit();
                    }
                } catch (e) {
                    logLine('Tizen exit failed: ' + e);
                }
            }
        };

        window.onerror = function (message, source, lineno, colno, error) {
            logErr('Global error: ' + message + ' at ' + source + ':' + lineno);
            Module.setStatus('Error: ' + message);
            return false;
        };

        window.addEventListener('unhandledrejection', function (e) {
            logErr('Unhandled promise rejection: ' + e.reason);
        });

        canvasElement.addEventListener('click', function () {
            canvasElement.focus();
        });

        canvasElement.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            return false;
        });

        window.addEventListener('load', function () {
            canvasElement.focus();
        });
    </script>

    <script>if (typeof globalThis === 'undefined') { window.globalThis = window; }</script>
    <script async src="chocolate-doom.js"></script>
</body>
</html>
