<!DOCTYPE html>
<html lang="en-us">
<head>
    <title>Doom</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: monospace;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            will-change: contents;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
        }

        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0f0;
            font-size: 20px;
            text-align: center;
            z-index: 100;
            text-shadow: 0 0 10px #0f0;
        }

        /* Frame counter overlay, top right. */
        #dbgf {
            position: absolute;
            top: 0;
            right: 0;
            padding: 6px;
            background: rgba(0, 0, 0, 0.75);
            color: #0ff;
            font-size: 13px;
            pointer-events: none;
            z-index: 200;
        }

        /* Support overlay (patch 0007): shown instead of the help pages, closes on the next key or click. */
        #support {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.92);
            color: #fff;
            text-align: center;
            z-index: 300;
        }

        #support img {
            width: 60vmin;
            height: 60vmin;
            background: #fff;
            image-rendering: pixelated;
        }

        #support p {
            margin-top: 24px;
            font-size: 22px;
        }

        #support small {
            display: block;
            margin-top: 12px;
            color: #aaa;
            font-size: 16px;
        }

        /* Options panel (patch 0008): replaces the Chocolate Doom options menu on Tizen. */
        #settings {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 40px;
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            font-family: sans-serif;
            z-index: 300;
        }

        #settings-main {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 60%;
        }

        #settings h1 {
            margin: 0 0 32px;
            font-family: Impact, 'Arial Narrow', sans-serif;
            font-size: 56px;
            letter-spacing: 3px;
            color: #b00;
            text-align: center;
            text-shadow: 3px 3px 0 #000;
        }

        #settings label:focus-within {
            color: #fc0;
        }

        #settings label {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
            font-size: 24px;
            color: #d00;
        }

        #settings label input {
            width: 100%;
            accent-color: #b00;
        }

        #settings button {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 14px 28px;
            font-family: Impact, 'Arial Narrow', sans-serif;
            font-size: 26px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #b00;
            background: linear-gradient(#5a3a1a, #2e1c0c);
            border: 4px solid;
            border-color: #8a5a2a #1a0e04 #1a0e04 #8a5a2a;
            cursor: pointer;
        }

        #settings button:focus {
            color: #fc0;
            background: linear-gradient(#7a1010, #3a0606);
            border-color: #fc0 #500 #500 #fc0;
            outline: none;
        }

        #settings button:focus::before {
            content: '\25B6  ';
        }

        #settings-controller {
            display: none;
            flex-direction: column;
            align-items: stretch;
            width: 60%;
        }

        #controller-list {
            max-height: 60vh;
            overflow-y: auto;
        }

        #controller-list button {
            font-size: 20px;
            letter-spacing: 0;
            text-transform: none;
            padding: 10px 20px;
            text-align: left;
        }

        #controller-hint {
            margin: 12px 0;
            font-size: 20px;
            color: #fc0;
            text-align: center;
        }

        #settings-log {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 90%;
            height: 100%;
        }

        #settings-log button {
            width: 50%;
        }

        #logtext {
            flex: 1;
            width: 100%;
            margin: 0 0 16px;
            padding: 12px;
            box-sizing: border-box;
            overflow-y: auto;
            background: #111;
            color: #0f0;
            font-size: 16px;
            white-space: pre-wrap;
            text-align: left;
        }

        /* Hidden text field: focusing it makes the TV show its on-screen keyboard (save-game names). */
        #textinput {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            border: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="1"></canvas>
    <div id="status">Loading Doom...</div>
    <div id="dbgf"></div>
    <form id="textform" action="javascript:void(0)"><input id="textinput" type="text" autocomplete="off" autocapitalize="characters"></form>
    <div id="support">
        <img src="paypal-qr.svg" alt="PayPal QR-Code">
        <p>Support the development on PayPal</p>
        <small>paypal.me/DennisOstermann</small>
        <small>Press any key to close</small>
    </div>
    <div id="settings">
        <div id="settings-main">
            <h1>Options</h1>
            <label>Sound effects volume <input type="range" id="sfxvol" min="0" max="15" value="8"></label>
            <label>Music volume <input type="range" id="musvol" min="0" max="15" value="8"></label>
            <button id="btn-aspect">4:3 aspect ratio: On</button>
            <small id="aspect-hint" style="display:none">Restart the game to apply the aspect ratio</small>
            <small>Game mode (selecting one restarts the game)</small>
            <div id="mode-list"></div>
            <small id="mode-hint" style="display:none"></small>
            <button id="btn-controller">Controller</button>
            <button id="btn-log">Console log</button>
            <button id="btn-back">Back</button>
        </div>
        <div id="settings-controller">
            <h1>Controller</h1>
            <div id="controller-list"></div>
            <small id="controller-hint" style="display:none"></small>
            <button id="btn-controller-reset">Reset to default</button>
            <button id="btn-controller-back">Back</button>
        </div>
        <div id="settings-log">
            <pre id="logtext" tabindex="0"></pre>
            <button id="btn-log-back">Back</button>
        </div>
    </div>

    <script src="input.js"></script>

    <script>
        'use strict';

        // Console capture for the options panel: keeps the last messages, even those logged before it opens.
        const consoleLines = [];
        ['log', 'info', 'warn', 'error'].forEach(function (name) {
            const original = console[name].bind(console);
            console[name] = function () {
                consoleLines.push(name.toUpperCase() + ' ' + Array.prototype.map.call(arguments, String).join(' '));
                if (consoleLines.length > 500) consoleLines.shift();
                original.apply(null, arguments);
            };
        });

        // Overlay: browser rAF calls/s (main loop alive) and Doom engine frames/s (I_FinishUpdate).
        (function () {
            const dbgf = document.getElementById('dbgf');
            let frames = 0;
            function countFrame() { frames++; requestAnimationFrame(countFrame); }
            requestAnimationFrame(countFrame);
            let lastFrames = 0, lastGame = 0;
            setInterval(function () {
                const g = (typeof Module !== 'undefined' && Module._doom_get_frames) ? Module._doom_get_frames() : 0;
                dbgf.textContent = 'raf ' + (frames - lastFrames) + ' | game ' + (g - lastGame) + ' | ' + (performance.now() / 1000).toFixed(1) + 's';
                lastFrames = frames;
                lastGame = g;
            }, 1000);
        })();

        // Text input bridge for Chocolate Doom (patch 0006): I_StartTextInput/I_StopTextInput
        // call these, and keys typed on the TV keyboard are sent back to the engine.
        (function () {
            const textInput = document.getElementById('textinput');
            const KEY_ENTER = 13, KEY_ESCAPE = 27, KEY_BACKSPACE = 0x7f;
            const special = { Enter: KEY_ENTER, Escape: KEY_ESCAPE, Backspace: KEY_BACKSPACE };

            function post(key) {
                if (typeof Module !== 'undefined' && Module._doom_post_key) Module._doom_post_key(key);
            }

            let textActive = false;
            window.doomTextInputStart = function () {
                textInput.value = '';
                textActive = true;
                textInput.focus();
            };
            window.doomTextInputStop = function () {
                textActive = false;
                textInput.blur();
            };
            // "Fertig" on the TV keyboard only closes it (blur); confirm the save name with Enter.
            textInput.addEventListener('blur', function () {
                if (!textActive) return;
                textActive = false;
                post(KEY_ENTER);
                document.getElementById('canvas').focus();
            });
            // The TV IME's "Fertig" submits the form (keyCode 229 keydown, no blur), so catch submit too.
            document.getElementById('textform').addEventListener('submit', function (e) {
                e.preventDefault();
                if (!textActive) return;
                textActive = false;
                post(KEY_ENTER);
                document.getElementById('canvas').focus();
            });
            textInput.addEventListener('keydown', function (e) {
                // 65376 is the TV keyboard's "Fertig" key; treat it as Enter.
                const key = special[e.key] !== undefined ? special[e.key] : ((e.keyCode === 13 || e.keyCode === 65376) ? KEY_ENTER : undefined);
                if (key !== undefined) {
                    e.preventDefault();
                    post(key);
                }
            });
            textInput.addEventListener('input', function () {
                const text = textInput.value;
                textInput.value = '';
                for (const ch of text) {
                    post(ch.charCodeAt(0));
                }
            });
        })();

        // Called by patch 0007 from the Read This! menu entry. Closes on the next key or click
        // and swallows that event so it does not also reach the game menu.
        (function () {
            const support = document.getElementById('support');
            function close(e) {
                e.preventDefault();
                e.stopPropagation();
                support.style.display = 'none';
                window.removeEventListener('keydown', close, true);
                window.removeEventListener('mousedown', close, true);
                window.removeEventListener('touchstart', close, true);
            }
            window.doomShowSupportQR = function () {
                support.style.display = 'flex';
                window.addEventListener('keydown', close, true);
                window.addEventListener('mousedown', close, true);
                window.addEventListener('touchstart', close, true);
            };
        })();

        // Chex and Free mode WADs are downloaded once from the repo's wads/ folder and cached in IndexedDB.
        const WADS_BASE_URL = 'https://raw.githubusercontent.com/dos-ise/doom-tizen/main/wads/';

        function requestToPromise(req) {
            return new Promise(function (resolve, reject) {
                req.onsuccess = function () { resolve(req.result); };
                req.onerror = function () { reject(req.error); };
            });
        }

        function openWadDb() {
            const req = indexedDB.open('doom-wads', 1);
            req.onupgradeneeded = function () { req.result.createObjectStore('wads'); };
            return requestToPromise(req);
        }

        // Returns the named WAD's bytes from IndexedDB, downloading and caching them from wads/ on first use.
        async function ensureWad(name) {
            const db = await openWadDb();
            const store = db.transaction('wads', 'readonly').objectStore('wads');
            let data = await requestToPromise(store.get(name));
            if (!data) {
                const res = await fetch(WADS_BASE_URL + name);
                if (!res.ok) throw new Error(name + ' download failed: HTTP ' + res.status);
                data = await res.arrayBuffer();
                const bytes = new Uint8Array(data);
                if (String.fromCharCode.apply(null, bytes.subarray(0, 4)) !== 'PWAD' &&
                    String.fromCharCode.apply(null, bytes.subarray(0, 4)) !== 'IWAD') {
                    throw new Error('downloaded ' + name + ' is not a valid WAD');
                }
                const writeStore = db.transaction('wads', 'readwrite').objectStore('wads');
                await requestToPromise(writeStore.put(data, name));
            }
            db.close();
            return new Uint8Array(data);
        }

        // Runs before the engine starts. Free mode writes freedoom1.wad as the IWAD; HacX mode writes hacx.wad as the IWAD;
        // Chex mode adds chex.wad as a PWAD. If a download fails, the game falls back to doom1.wad (Free/HacX) or the regular game (Chex).
        function prepareWads() {
            if (HACX_MODE) {
                return ensureWad('hacx.wad').then(function (bytes) {
                    Module.FS.writeFile('/hacx.wad', bytes);
                }).catch(function (e) {
                    console.error('HacX mode disabled for this start:', e);
                    Module.setStatus('HacX mode unavailable, starting Doom');
                    Module.arguments[Module.arguments.indexOf('-iwad') + 1] = 'doom1.wad';
                    return fetch('doom1.wad').then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
                        Module.FS.writeFile('/doom1.wad', new Uint8Array(buf));
                    });
                });
            }
            if (FREE_MODE) {
                return ensureWad('freedoom1.wad').then(function (bytes) {
                    Module.FS.writeFile('/freedoom1.wad', bytes);
                }).catch(function (e) {
                    console.error('Free mode disabled for this start:', e);
                    Module.setStatus('Free mode unavailable, starting Doom');
                    Module.arguments[Module.arguments.indexOf('-iwad') + 1] = 'doom1.wad';
                    return fetch('doom1.wad').then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
                        Module.FS.writeFile('/doom1.wad', new Uint8Array(buf));
                    });
                });
            }
            if (!CHEX_MODE) return Promise.resolve();
            return ensureWad('chex.wad').then(function (bytes) {
                Module.FS.writeFile('/chex.wad', bytes);
                Module.arguments.push('-file', 'chex.wad');
            }).catch(function (e) {
                console.error('Chex mode disabled for this start:', e);
                Module.setStatus('Chex mode unavailable, starting Doom');
            });
        }

        // Options panel (patch 0008): called by M_Options. Sliders set the engine volume directly;
        // "Console log" shows the captured console output in a scrollable view.
        (function () {
            const panel = document.getElementById('settings');
            const main = document.getElementById('settings-main');
            const logView = document.getElementById('settings-log');
            const logText = document.getElementById('logtext');
            const sfx = document.getElementById('sfxvol');
            const music = document.getElementById('musvol');

            function setVolume() {
                if (typeof Module !== 'undefined' && Module._doom_set_volume) {
                    Module._doom_set_volume(parseInt(sfx.value, 10), parseInt(music.value, 10));
                }
            }
            sfx.addEventListener('input', setVolume);
            music.addEventListener('input', setVolume);

            // Stored in localStorage and written into chocolate-doom.cfg before the next start (see preRun).
            const aspectBtn = document.getElementById('btn-aspect');
            function renderAspect() {
                aspectBtn.textContent = '4:3 aspect ratio: ' + (getAspect() ? 'On' : 'Off');
            }
            // Default is widescreen (0); 4:3 only when explicitly enabled (1).
            function getAspect() {
                return localStorage.getItem('doomAspectRatio') === '1';
            }
            aspectBtn.addEventListener('click', function () {
                localStorage.setItem('doomAspectRatio', getAspect() ? '0' : '1');
                renderAspect();
                document.getElementById('aspect-hint').style.display = '';
            });
            renderAspect();

            // One selection for the mode. Chex, Free and HacX are mutually exclusive; Standard turns them all off.
            // Free needs freedoom1.wad as IWAD, HacX needs hacx.wad as IWAD, Chex needs doom1.wad.
            // Each mode downloads its WAD from wads/ in this repo on first select, then the page reloads with that mode.
            const modes = {
                standard: { key: null, label: 'Standard' },
                chex: { key: 'doomChexMode', label: 'Chex', wad: 'chex.wad' },
                free: { key: 'doomFreeMode', label: 'Free', wad: 'freedoom1.wad' },
                hacx: { key: 'doomHacxMode', label: 'HacX', wad: 'hacx.wad' }
            };
            const modeOrder = ['standard', 'chex', 'free', 'hacx'];
            const modeList = document.getElementById('mode-list');
            const modeHint = document.getElementById('mode-hint');
            let modeBusy = false;
            function activeMode() {
                const found = Object.keys(modes).find(function (name) {
                    return modes[name].key && localStorage.getItem(modes[name].key) === '1';
                });
                return found || 'standard';
            }
            // The mode the engine loaded with. Selecting another mode reloads the page, so this label stays accurate.
            const runningMode = activeMode();
            function renderModes() {
                modeList.innerHTML = '';
                modeOrder.forEach(function (name) {
                    const btn = document.createElement('button');
                    const selected = name === activeMode();
                    btn.setAttribute('role', 'radio');
                    btn.setAttribute('aria-checked', String(selected));
                    btn.textContent = (selected ? '[*] ' : '[ ] ') + modes[name].label + (name === runningMode ? '  (running)' : '');
                    btn.addEventListener('click', function () { selectMode(name); });
                    modeList.appendChild(btn);
                });
            }
            function showModeHint(text) {
                modeHint.textContent = text;
                modeHint.style.display = '';
            }
            function selectMode(name) {
                if (modeBusy || name === activeMode()) return;
                const mode = modes[name];
                if (!mode.key) {
                    Object.keys(modes).forEach(function (other) {
                        if (modes[other].key) localStorage.setItem(modes[other].key, '0');
                    });
                    location.reload();
                    return;
                }
                modeBusy = true;
                showModeHint('Downloading ' + mode.wad + '...');
                ensureWad(mode.wad).then(function () {
                    Object.keys(modes).forEach(function (other) {
                        if (modes[other].key) localStorage.setItem(modes[other].key, other === name ? '1' : '0');
                    });
                    location.reload();
                }).catch(function (e) {
                    console.error(e);
                    modeBusy = false;
                    showModeHint('Download failed: ' + e.message);
                });
            }
            renderModes();

            const controllerView = document.getElementById('settings-controller');
            const controllerList = document.getElementById('controller-list');
            const controllerHint = document.getElementById('controller-hint');

            function showMain() {
                cancelGamepadCapture();
                logView.style.display = 'none';
                controllerView.style.display = 'none';
                main.style.display = 'flex';
                // First button, not the first item: A only activates buttons, so a slider must not get focus here.
                const firstButton = main.querySelector('button');
                if (firstButton) firstButton.focus();
            }
            function showLog() {
                logText.textContent = consoleLines.join('\n');
                main.style.display = 'none';
                logView.style.display = 'flex';
                logText.scrollTop = logText.scrollHeight;
                logText.focus();
            }
            function renderControllerList(focusAction) {
                controllerList.innerHTML = '';
                let focusBtn = null;
                CONTROLLER_ACTION_ORDER.forEach(function (name) {
                    const btn = document.createElement('button');
                    const button = getGamepadButtonFor(name);
                    btn.textContent = ACTION_LABELS[name] + ': ' + (button === null ? 'not bound' : gamepadButtonName(button));
                    btn.addEventListener('click', function () { beginRebind(name); });
                    controllerList.appendChild(btn);
                    if (name === focusAction) focusBtn = btn;
                });
                const first = controllerList.firstChild;
                if (focusBtn) focusBtn.focus(); else if (first) first.focus();
            }
            function beginRebind(name) {
                controllerHint.textContent = 'Press a gamepad button for "' + ACTION_LABELS[name] + '" (Select to cancel)';
                controllerHint.style.display = '';
                startGamepadCapture(name, function (button) {
                    controllerHint.style.display = 'none';
                    if (button !== null) setGamepadButton(name, button);
                    if (controllerView.style.display === 'flex') renderControllerList(name);
                });
            }
            function showController() {
                main.style.display = 'none';
                controllerView.style.display = 'flex';
                controllerHint.style.display = 'none';
                renderControllerList(null);
            }
            function close() {
                cancelGamepadCapture();
                panel.style.display = 'none';
                document.getElementById('canvas').focus();
            }

            document.getElementById('btn-controller').addEventListener('click', showController);
            document.getElementById('btn-controller-back').addEventListener('click', showMain);
            document.getElementById('btn-controller-reset').addEventListener('click', function () {
                resetGamepadMap();
                renderControllerList(null);
            });
            document.getElementById('btn-log').addEventListener('click', showLog);
            document.getElementById('btn-log-back').addEventListener('click', showMain);
            document.getElementById('btn-back').addEventListener('click', close);

            // Keys stay inside the panel so they do not reach the game. Escape and the TV Back key
            // (10009) close the panel, or step back from a sub-view. Gamepad menu input (input.js)
            // calls window.doomPanelNav with the same names, so keyboard and gamepad share one path.
            function currentView() {
                if (logView.style.display === 'flex') return logView;
                if (controllerView.style.display === 'flex') return controllerView;
                return main;
            }
            function visibleItems() {
                return Array.prototype.slice.call(currentView().querySelectorAll('input, button, pre'));
            }
            function moveFocus(step) {
                const items = visibleItems();
                const i = items.indexOf(document.activeElement);
                const next = items[(i + step + items.length) % items.length];
                if (next) next.focus();
            }
            function adjustSlider(delta) {
                const el = document.activeElement;
                if (el && el.type === 'range') {
                    el.value = Math.min(+el.max, Math.max(+el.min, +el.value + delta));
                    el.dispatchEvent(new Event('input'));
                }
            }
            // The TV can report A/B both as gamepad buttons and as Enter/10009 keys. Repeated
            // confirm/back within this window is one press, so it is not handled twice.
            const lastMenuPress = { confirm: 0, back: 0 };
            function panelNav(name) {
                // While waiting for a rebind, only Back is handled (cancels the capture).
                if (isGamepadCapturing()) {
                    if (name === 'back') cancelGamepadCapture();
                    return;
                }
                if (name === 'confirm' || name === 'back') {
                    const now = Date.now();
                    if (now - lastMenuPress[name] < 250) return;
                    lastMenuPress[name] = now;
                }
                if (name === 'up') moveFocus(-1);
                else if (name === 'down') moveFocus(1);
                else if (name === 'left') adjustSlider(-1);
                else if (name === 'right') adjustSlider(1);
                else if (name === 'confirm') {
                    const el = document.activeElement;
                    if (!el || !panel.contains(el)) {
                        showMain();
                    } else if (el.tagName === 'BUTTON') {
                        el.click();
                    }
                }
                else if (name === 'back') {
                    if (logView.style.display === 'flex' || controllerView.style.display === 'flex') showMain();
                    else close();
                }
            }
            window.doomPanelNav = panelNav;

            const KEY_NAMES = { 38: 'up', 40: 'down', 37: 'left', 39: 'right', 13: 'confirm', 27: 'back', 10009: 'back' };
            panel.addEventListener('keydown', function (e) {
                e.stopPropagation();
                const name = KEY_NAMES[e.keyCode] || (e.key === 'Escape' ? 'back' : null);
                if (!name) return;
                e.preventDefault();
                panelNav(name);
            });

            window.doomShowSettings = function () {
                panel.style.display = 'flex';
                showMain();
            };
        })();

        const statusElement = document.getElementById('status');
        const canvasElement = document.getElementById('canvas');

        // Fit the canvas box to its own pixel aspect. The TV keyboard resizes the
        // window, which can change the canvas pixel size; a fixed 100%x100% box
        // would then stretch the picture instead of keeping the letterbox.
        let lastFit = '';
        function fitCanvas() {
            const cw = canvasElement.width, ch = canvasElement.height;
            if (!cw || !ch) return;
            const key = cw + 'x' + ch + '@' + window.innerWidth + 'x' + window.innerHeight;
            if (key === lastFit) return;
            lastFit = key;
            const s = Math.min(window.innerWidth / cw, window.innerHeight / ch);
            const w = Math.round(cw * s), h = Math.round(ch * s);
            canvasElement.style.width = w + 'px';
            canvasElement.style.height = h + 'px';
            canvasElement.style.left = Math.round((window.innerWidth - w) / 2) + 'px';
            canvasElement.style.top = Math.round((window.innerHeight - h) / 2) + 'px';
        }
        window.addEventListener('resize', fitCanvas);
        setInterval(fitCanvas, 300);

        // Internal render resolution. The software renderer is the bottleneck,
        // so we render at a low resolution and let CSS upscale to full screen.
        // Lower to 640x400 on very weak TVs if 960x540 is still too slow.
        const GAME_WIDTH = 960;
        const GAME_HEIGHT = 540;
        // Free mode uses freedoom1.wad and HacX mode uses hacx.wad (both downloaded from wads/ on enable) as the IWAD.
        // Read once at load; applied on restart.
        const FREE_MODE = localStorage.getItem('doomFreeMode') === '1';
        const HACX_MODE = localStorage.getItem('doomHacxMode') === '1';
        const CHEX_MODE = localStorage.getItem('doomChexMode') === '1';
        const IWAD = HACX_MODE ? 'hacx.wad' : FREE_MODE ? 'freedoom1.wad' : 'doom1.wad';
        // Each mode keeps its own saves (/save-<slot> in MEMFS, savegames-<slot> on the TV).
        const SAVE_SLOT = HACX_MODE ? 'hacx' : FREE_MODE ? 'free' : CHEX_MODE ? 'chex' : '';

        var Module = {
            // main() is started manually in startGame() so the browser can paint the loading status first.
            noInitialRun: true,

            arguments: [
                "-iwad", IWAD,
                "-window",
                "-nogui",
                "-config", "default.cfg",
                "-extraconfig", "chocolate-doom.cfg",
                "-width", GAME_WIDTH.toString(),
                "-height", GAME_HEIGHT.toString(),
                "-savedir", '/save' + (SAVE_SLOT ? '-' + SAVE_SLOT : '')
            ],

            preRun: [
                function () {
                    console.log('preRun: Loading game files...');
                    try {
                        if (!FREE_MODE && !HACX_MODE) Module.FS_createPreloadedFile('/', 'doom1.wad', 'doom1.wad', true, false);
                        Module.FS_createPreloadedFile('/', 'default.cfg', 'default.cfg', true, false);
                        // chocolate-doom.cfg is read synchronously so the saved aspect ratio can be applied.
                        const xhr = new XMLHttpRequest();
                        xhr.open('GET', 'chocolate-doom.cfg', false);
                        xhr.send();
                        if (xhr.status !== 200 && xhr.status !== 0) throw new Error('chocolate-doom.cfg: HTTP ' + xhr.status);
                        let cfg = xhr.responseText;
                        const aspect = localStorage.getItem('doomAspectRatio') === '1' ? '1' : '0';
                        cfg = cfg.replace(/^aspect_ratio_correct\s+\d+/m, 'aspect_ratio_correct ' + aspect);
                        Module.FS.writeFile('/chocolate-doom.cfg', cfg);
                        DoomSaves.start(Module.FS, SAVE_SLOT);
                        console.log('Files loaded successfully');
                    } catch (e) {
                        console.error('Error loading files:', e);
                        Module.setStatus('Error loading game files');
                    }
                }
            ],

            postRun: [],

            print: function (text) {
                console.log('[stdout]', text);
            },

            printErr: function (text) {
                console.error('[stderr]', text);
            },

            canvas: (function () {
                canvasElement.addEventListener("webglcontextlost", function (e) {
                    alert('WebGL context lost. You will need to reload the page.');
                    e.preventDefault();
                }, false);

                canvasElement.addEventListener("webglcontextrestored", function (e) {
                    console.log('WebGL context restored');
                }, false);

                return canvasElement;
            })(),

            setStatus: function (text) {
                if (text) {
                    console.log('Status:', text);
                    statusElement.textContent = text;
                    statusElement.style.display = 'block';
                } else {
                    statusElement.style.display = 'none';
                }
            },

            totalDependencies: 0,

            monitorRunDependencies: function (left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(
                    left
                        ? 'Loading... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
                        : 'Starting game...'
                );
            },

            onRuntimeInitialized: function () {
                console.log('Runtime initialized successfully');
                canvasElement.focus();
                setupRemoteControl();
                Module.setStatus('Starting Doom...');
                // Two frames: the first paints the status, the second lets the browser commit it
                // before the synchronous game init blocks the main thread.
                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        setTimeout(function () {
                    prepareWads().then(startGame);
                }, 0);
                    });
                });
            },

            onAbort: function (what) {
                console.error('Abort:', what);
                Module.setStatus('Game crashed: ' + what);
            },

            onExit: function (code) {
                console.log('Game exited with code:', code);
                Module.setStatus('Game exited');
                try {
                    if (window.tizen && tizen.application) {
                        tizen.application.getCurrentApplication().exit();
                    }
                } catch (e) {
                    console.log('Tizen exit failed:', e);
                }
            }
        };

        // Blocks during game init. Returns once the SDL main loop is registered, so the
        // status is hidden on the next frame, after the first game frame has been drawn.
        function startGame() {
            Module.callMain(Module.arguments);
            requestAnimationFrame(function () {
                Module.setStatus('');
            });
        }

        window.onerror = function (message, source, lineno, colno, error) {
            console.error('Global error:', message, 'at', source, lineno, colno);
            Module.setStatus('Error: ' + message);
            return false;
        };

        canvasElement.addEventListener('click', function () {
            canvasElement.focus();
        });

        canvasElement.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            return false;
        });

        window.addEventListener('load', function () {
            canvasElement.focus();
        });
    </script>

    <script>if (typeof globalThis === 'undefined') { window.globalThis = window; }</script>
    <script src="savesync.js"></script>
    <script async src="chocolate-doom.js"></script>
</body>
</html>
