# This workflow builds a Docker image from the repository, pushes it to GitHub Container Registry, and then triggers a second job to extract an artifact and create a GitHub release.
name: Release (Development)
# Configure this workflow to be triggered manually from the GitHub Actions tab for development-related branches.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0). Leave empty for a timestamped pre-release.'
        required: false
        default: ''
      tizen55:
        description: 'Build for Tizen 5.5 (Chromium 69): lowers JS with esbuild. May break input on newer TVs.'
        required: false
        default: 'false'
        type: boolean
# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      issues: write
      actions: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ github.sha }}
    # This job checks out the code, logs into GitHub Container Registry, builds the Docker image with metadata, pushes it to the registry, and triggers the next workflow via repository dispatch.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Uses the `docker/login-action` action to log in to the Container registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      # This step uses the `docker/build-push-action` action to build the image, based on your repository's `Dockerfile`. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see "[Usage](https://github.com/docker/build-push-action#usage)" in the README of the `docker/build-push-action` repository.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TIZEN55_COMPAT=${{ github.event.inputs.tizen55 == 'true' && '1' || '0' }}
  run-and-upload-release:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: write
      packages: read
      issues: write
      actions: write
    # This job depends on the completion of the build-and-push-image job. It checks out the repository, generates a timestamp, deletes any existing GitHub pre-releases from the same branch to avoid duplicates, extracts build artifacts from the Docker image, and creates a new GitHub pre-release with the extracted files.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Uses the `docker/login-action` action to log in to the Container registry using the account and password that will run the container.
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Generates a timestamp number from the current date and time for use in tagging and pre-release.
      - name: Generate timestamp number
        run: |
          TIMESTAMP=$(TZ="CET" date +"%Y.%m%d.%H%M")
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
      # Extracts the branch name from the Git reference, replacing any slashes with dashes for compatibility in tagging and pre-release naming.
      - name: Extract branch name
        run: |
          BRANCH=${GITHUB_REF_NAME//\//-}
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
      # Sets the full Docker image tag using the output from the 'build-and-push-image' job.
      - name: Set up image tag
        run: echo "IMAGE_TAG=${{ needs.build-and-push-image.outputs.image_tag }}" >> $GITHUB_ENV
      # Deletes any existing GitHub pre-releases from the same branch to avoid duplicates.
      # Only runs for the timestamped pre-release flow, not for versioned releases.
      - name: Check and delete any existing GitHub pre-releases from the same branch
        if: ${{ github.event.inputs.version == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for existing pre-releases from branch: $BRANCH"
          releases=$(curl -sSL \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases")
          dev_releases=$(echo "$releases" | jq -c ".[] | select(.prerelease==true and (.tag_name | contains(\"$BRANCH\")))")
          if [ -z "$dev_releases" ]; then
            echo "No pre-releases found for branch: $BRANCH"
          else
            echo "Found one or more pre-releases for branch: $BRANCH"
            echo "Starting cleanup..."
            echo "$dev_releases" | while read -r release; do
              release_id=$(echo "$release" | jq -r '.id')
              release_name=$(echo "$release" | jq -r '.name')
              tag_name=$(echo "$release" | jq -r '.tag_name')
              echo "Deleting pre-release: $release_name (ID: $release_id)"
              curl -sSL -X DELETE \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/releases/$release_id"
              echo "Deleting tag reference: $tag_name"
              curl -sSL -X DELETE \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/${tag_name}"
            done
            echo "Cleanup completed."
          fi
      # Runs the Docker container in detached mode to extract the build artifact.
      - name: Run Docker container
        run: |
          docker run -d --name temp_container $IMAGE_TAG
      - name: Copy artifacts from Docker container
        run: |
          docker cp temp_container:/home/doom/Doom.wgt .
      # Extracts the generated JS/WASM from the WGT (a zip) so they can be
      # inspected directly (release assets are not always reachable).
      - name: Extract JS/WASM from WGT
        run: |
          mkdir -p wgt_extract
          unzip -o Doom.wgt -d wgt_extract
          cp wgt_extract/chocolate-doom.js .
          cp wgt_extract/chocolate-doom.wasm .
      - name: Upload JS/WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chocolate-doom-js-wasm
          path: |
            chocolate-doom.js
            chocolate-doom.wasm
          if-no-files-found: error
      # Analyzes the generated JS/WASM and saves findings to analysis.md.
      # Non-blocking: a failure here must not prevent the release from being
      # created. Downloads binaryen 133 (matching the emsdk) for wasm-dis.
      - name: Analyze WASM/JS
        run: |
          set +e
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz -o /tmp/binaryen.tar.gz
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          export PATH="/tmp/binaryen-version_133/bin:$PATH"
          bash scripts/analyze-wasm.sh chocolate-doom.wasm chocolate-doom.js
          echo "analysis_exit=$?" >> "$GITHUB_ENV"
      # Stops and removes the temporary Docker container to clean up resources.
      - name: Stop and remove Docker container
        run: |
          docker stop temp_container && docker rm temp_container
      # Creates a GitHub release. If a version was provided via workflow_dispatch,
      # it creates a proper release (e.g. v1.0); otherwise a timestamped pre-release.
      - name: Create GitHub release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RELEASE_TAG="v${{ github.event.inputs.version }}"
            RELEASE_NAME="v${{ github.event.inputs.version }}"
            PRERELEASE=""
            NOTES="# Doom Tizen v${{ github.event.inputs.version }}

          - Ensure your Samsung TV is running Tizen OS version 5.5 or higher.

          ## What's Changed:

          - Performance: low internal render resolution, fixed key bindings, new TV controls
          - Tizen 5.5 (Chromium 69) compatibility
          - Updated chocolate-doom submodule"
          else
            RELEASE_TAG="v${{ env.TIMESTAMP }}-${{ env.BRANCH }}"
            RELEASE_NAME="v${{ env.TIMESTAMP }}-${{ env.BRANCH }}"
            PRERELEASE="--prerelease"
            NOTES="# Doom Tizen v${{ env.TIMESTAMP }}

          - Ensure your Samsung TV is running Tizen OS version 5.5 or higher.

          ## What's Changed:

          - Add all the changes you made to this version using bullet points.

          > [!WARNING]
          > This is a **pre-release** version intended for development and testing purposes.
          > It may include experimental features and bug fixes, but could be less stable than official releases."
          fi
          gh release create "$RELEASE_TAG" ./Doom.wgt \
            --title "$RELEASE_NAME" \
            --notes "$NOTES" \
            $PRERELEASE \
            --repo "${{ github.repository }}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      # Posts the WASM/JS analysis by committing it to the repo (release
      # comments are disabled in this repo; artifacts are not downloadable).
      - name: Commit analysis to repo
        if: hashFiles('analysis.md') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p analysis
          cp analysis.md analysis/latest.md
          git add analysis/latest.md
          git commit -m "Update WASM/JS analysis" || echo "no changes to commit"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${{ github.ref_name }}" || echo "push failed"
